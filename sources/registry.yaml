# Source registry: one entry per portal. Adapters live in pipeline/adapters/.
# tier 1 = state e-procurement, tier 2 = parastatals/municipal, tier 3 =
# goods/services & central agencies (marked funding_level: central).
# status: implemented | planned. Only implemented adapters are ingested.

sources:
  - key: mahatenders
    name: Maharashtra e-Procurement (NIC GePNIC)
    tier: 1
    base_url: https://mahatenders.gov.in
    adapter: pipeline.adapters.mahatenders
    engine: requests
    funding_level: state
    status: implemented
    notes: >
      All organisations. Live + corrigenda via the captcha-free
      Tenders-by-Organisation listing; awards/AOC via the human-in-the-loop
      keyword import. See docs/portals/mahatenders.md.

  # --- Tier 2: parastatals & municipal corporations (planned) ---
