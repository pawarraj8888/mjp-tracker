name: MJP Tender Tracker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mjp-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python tracker.py

      # Keep the canonical pipeline outputs (used by the dashboard) fresh:
      # correct any newly imported award amounts, re-ingest, then regenerate
      # analytics.json + notifications.json + data_status.json. Best-effort so a
      # pipeline hiccup never blocks the core tracker state commit.
      - name: Refresh pipeline exports
        if: always()
        continue-on-error: true
        run: |
          pip install -r requirements-pipeline.txt
          python backfill_money.py || true
          python -m pipeline ingest || true
          python -m pipeline export || true

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git add details_cache.json live.json 2>/dev/null || true
          git add awards.json analytics.json notifications.json data_status.json corrections.json awards.pre_money_fix.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update tracker + pipeline state"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin ${GITHUB_REF_NAME} && git push && exit 0
              sleep 5
            done
            exit 1
          fi
